name: Android

on:
  push:
    branches: [main, dev]
    paths:
      - android/**
      - ds-bot/package.json
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - ds-bot/package.json
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Decode the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsbot.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dsbot.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Verify release refuses cleartext
        run: |
          manifest="$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)"
          test -n "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
