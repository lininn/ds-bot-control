name: Android

# The phone app is a WebView around the page the relay serves, so it is built apart from the
# release: only the shell changes when it changes, and a dispatch or a push under android/
# hands out an installable APK without touching npm or the desktop installers.
#
# Signing: a release build uses the key in ANDROID_KEYSTORE_BASE64 (+ _PASSWORD, _ALIAS,
# _KEY_PASSWORD) when the repository has those secrets. Without them the debug key is used,
# which installs the same way but differs on every run, so an update needs an uninstall.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Mobile app (Android APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use the repository's app key when it has one
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Check the APK
        run: |
          version="$(node -p "require('../ds-bot/package.json').version")"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          echo "Built $apk for $version"
          ls -l "$apk"

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Bot-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
