name: Release

# Publishes ds-bot to npm when a GitHub release is published, then attaches the desktop app's
# Windows installer, macOS zips and Linux packages to the release. Windows and the Linux
# AppImage update from latest.yml / latest-linux.yml; macOS and the Linux deb open the release
# page for a manual download.
#
# npm Trusted Publishing: npm trusts this workflow through GitHub's OIDC token, so the
# repository keeps no npm token, and every version gets a provenance statement. It is set
# up once on npmjs.com: package ds-bot → Settings → Trusted Publisher → GitHub Actions,
# user lininn, repository ds-bot-control, workflow release.yml, no environment.
#
# The release tag must be v<version in ds-bot/package.json> and must point at a commit on
# main. A version with a pre-release part (0.2.0-rc.1) goes to the npm tag "next", so that
# "latest" stays on the last stable version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and pack the package, but do not publish
        type: boolean
        default: true

permissions:
  # write: attach the package file to the release.
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything a release must satisfy before anything is built or published: the tag matches
  # the version, one version across the plugin, the app and the shell, and the test suite
  # passes. The packaging jobs need only this, so a registry that refuses a publish cannot
  # hide the installers.
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag and the branch
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is $TAG, but ds-bot/package.json has version $version. Tag v$version or change the version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi

      - name: Check the app and web versions
        run: |
          version="$(node -p "require('./package.json').version")"
          app="$(node -p "require('../app/package.json').version")"
          if [ "$app" != "$version" ]; then
            echo "::error::app/package.json has version $app, but ds-bot/package.json has $version. Give both the same version."
            exit 1
          fi
          # The remote-control shell ships with the same version, and its manifest must agree
          # so the relay can match a desktop to a web bundle.
          web="$(node -p "require('../web/package.json').version")"
          manifest="$(node -p "require('../web/manifest.json').version")"
          if [ "$web" != "$version" ] || [ "$manifest" != "$version" ]; then
            echo "::error::web/package.json is $web and web/manifest.json is $manifest, but ds-bot/package.json is $version. Give all three the same version."
            exit 1
          fi

      - run: npm ci --no-fund --no-audit
      - run: npm run harness
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2 --no-fund --no-audit
      - run: npm ci --no-fund --no-audit

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      # The release keeps the package file for installs without npm. It is attached before the
      # publish, so a registry that refuses the version still leaves a usable release.
      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm pack
          gh release upload "$TAG" "lininn-ds-bot-$(node -p "require('./package.json').version").tgz" --clobber

      - name: Publish
        if: github.event_name == 'release' || (!inputs.dry_run && github.ref == 'refs/heads/main')
        run: |
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          echo "Publishing $(node -p "require('./package.json').version") with the npm tag $tag"
          npm publish --provenance --access public --tag "$tag"

  # The remote-control web shell. It ships as a prebuilt dist/; the relay unpacks the packed
  # tarball into web-dist/<version>/. Trusted Publishing must be configured once on npmjs.com
  # for @lininn/ds-web (same GitHub trusted publisher settings as ds-bot).
  publish-web:
    name: Build and publish @lininn/ds-web
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.6.2 --no-fund --no-audit
      - run: npm install --no-package-lock --no-fund --no-audit
      - run: npm run build
      - name: Check the build and manifest
        run: |
          test -f dist/index.html
          node -e "const p=require('./package.json'),m=require('./manifest.json'); if(p.version!==m.version){console.error('manifest.json version must equal package.json');process.exit(1)}"

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      # The phone shell has no installer: this is the build a relay serves from
      # web-dist/<version>/, plus the package file, kept for real-device checks.
      - name: Keep the shell for real-device checks
        if: github.event_name == 'workflow_dispatch'
        run: npm pack

      - name: Upload the shell for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Bot-web
          path: |
            web/dist
            web/manifest.json
            web/*.tgz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Attach the web package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm pack
          gh release upload "$TAG" "lininn-ds-web-$(node -p "require('./package.json').version").tgz" --clobber

      - name: Publish
        if: github.event_name == 'release' || (!inputs.dry_run && github.ref == 'refs/heads/main')
        run: |
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          echo "Publishing $(node -p "require('./package.json').version") with the npm tag $tag"
          npm publish --provenance --access public --tag "$tag"

  app-windows:
    name: Desktop app installer (Windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the installer for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Bot-win-x64
          path: app/dist-pack/DeepSeek-Bot-*-win-x64.exe
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          installer="dist-pack/DeepSeek-Bot-$(node -p "require('./package.json').version")-win-x64.exe"
          gh release upload "$TAG" "$installer" "$installer.blockmap" dist-pack/latest.yml --clobber

  app-macos:
    name: Desktop app zip (macOS ${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the zip for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Bot-mac-${{ matrix.arch }}
          path: app/dist-pack/DeepSeek-Bot-*-mac-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip="dist-pack/DeepSeek-Bot-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          gh release upload "$TAG" "$zip" --clobber

  app-linux:
    name: Desktop app packages (Linux x64)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces that Chromium's
        # sandbox needs; the release runner may lift that restriction (it is its own machine).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/check-packed.mjs
      - name: Check the files for the release
        # The dry run never uploads, so it checks here that every file the release attaches exists.
        run: |
          version="$(node -p "require('./package.json').version")"
          ls -l "dist-pack/DeepSeek-Bot-$version-linux-x86_64.AppImage" "dist-pack/DeepSeek-Bot-$version-linux-amd64.deb" dist-pack/latest-linux.yml
      - name: Keep the packages for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Bot-linux-x64
          path: |
            app/dist-pack/DeepSeek-Bot-*-linux-x86_64.AppImage
            app/dist-pack/DeepSeek-Bot-*-linux-amd64.deb
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # The AppImage carries its block map inside the file, so there is no .blockmap to attach.
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "$TAG" "dist-pack/DeepSeek-Bot-$version-linux-x86_64.AppImage" "dist-pack/DeepSeek-Bot-$version-linux-amd64.deb" dist-pack/latest-linux.yml --clobber

  # The phone app is only a window onto the shell publish-web builds, so it needs the same
  # checks and nothing else. android.yml builds it on its own for iteration; a release needs
  # it here, next to the desktop installers.
  app-android:
    name: Mobile app (Android APK)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Use the repository's app key when it has one
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Check the APK
        run: test -f app/build/outputs/apk/release/app-release.apk
      - name: Keep the APK for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Bot-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('../ds-bot/package.json').version")"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DeepSeek-Bot-$version-android.apk"
          gh release upload "$TAG" "dist/DeepSeek-Bot-$version-android.apk" --clobber
