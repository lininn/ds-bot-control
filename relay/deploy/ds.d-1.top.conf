# OpenResty/nginx site for the public DS Bot relay (ds.d-1.top).
#
# On the kd1 host this file goes where 1Panel keeps site configs
# (/opt/1panel/www/conf.d/ds.d-1.top.conf) and the certificates are the ones
# 1Panel issues for the site (/www/sites/ds.d-1.top/ssl/). Create the site in
# 1Panel first so the DNS challenge can run and write the certificate, then
# paste the location block below into its proxy config.
#
# Do NOT create this file before DNS and the certificate exist: nginx refuses
# to reload when ssl_certificate points at a missing file, which would take
# every site down.

server {
    listen 80;
    listen [::]:80;
    server_name ds.d-1.top;

    location /.well-known/acme-challenge {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ds.d-1.top;

    ssl_certificate     /www/sites/ds.d-1.top/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/ds.d-1.top/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;

        # WebSocket upgrade: the desktop connector holds one long /connector socket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # MUST pass the browser's Host through. /api/login, /api/desktop/login and
        # /api/devices/select compare Origin against Host; with the default
        # $proxy_host the comparison fails and sign-in returns 403.
        proxy_set_header Host $http_host;

        # SSE feed: no buffering, no cache, long-lived connection.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Requires, in the http{} block (1Panel: /opt/1panel/www/conf.d/00-upgrade.conf
# or similar):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# Rate limiting: the relay counts login attempts by socket address and does not
# read X-Forwarded-For, so behind this proxy every request is 127.0.0.1 and its
# 10/minute limit becomes global. Add a per-client limit here instead:
#
#   # http{}:  limit_req_zone $binary_remote_addr zone=ds_relay_login:10m rate=10r/m;
#   location = /api/login { limit_req zone=ds_relay_login burst=5 nodelay; }
